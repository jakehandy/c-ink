name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core renderer and simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S sim -B sim/build -DCMAKE_BUILD_TYPE=Release && cmake --build sim/build -j
      - name: Test
        run: ./sim/build/cink_tests
      - name: Probe tool tests
        run: python3 -m unittest discover -s tools/tickey-probe -v
      - name: Render every screen
        run: python3 sim/fixtures/make_fixtures.py && python3 tools/render_screens.py && git diff --stat -- sim/fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: docs/screens/

  firmware:
    name: Firmware (ESP32-S3)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          idf.py set-target esp32s3
          idf.py build
          idf.py size
      - name: Size budget
        run: python3 tools/check_size.py firmware/build/c-ink.bin
      - name: Keep build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build-logs
          path: |
            firmware/build/log/
            firmware/build/config/sdkconfig.h
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/build/c-ink.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json

  bridge:
    name: Bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Test
        working-directory: desktop
        run: cargo test -p cink-bridge

  desktop:
    name: Settings app (${{ matrix.name }})
    needs: bridge
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, args: "--target universal-apple-darwin", targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
          - { name: Windows, os: windows-latest, args: "", targets: "" }
          - { name: Linux, os: ubuntu-22.04, args: "", targets: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev
      - name: Build
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: C-Ink-Settings-${{ matrix.name }}
          path: |
            desktop/target/**/release/bundle/dmg/*.dmg
            desktop/target/**/release/bundle/nsis/*.exe
            desktop/target/**/release/bundle/msi/*.msi
            desktop/target/**/release/bundle/appimage/*.AppImage
            desktop/target/**/release/bundle/deb/*.deb
          if-no-files-found: warn
